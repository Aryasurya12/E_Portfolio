<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arya Pramod Suryavanshi | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
            },
            colors: {
              glass: "rgba(255, 255, 255, 0.05)",
              glassBorder: "rgba(255, 255, 255, 0.1)",
              neonCyan: "#00f3ff",
              neonPurple: "#bc13fe",
              primaryPurple: "#8b5cf6",
              secondaryPink: "#ec4899",
              accentGlow: "#a78bfa",
              accentPink: "#f472b6",
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'blob': 'blob 7s infinite',
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'letter-pop': 'letterPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
              'spin-slow': 'spin 8s linear infinite',
            },
            keyframes: {
              blob: {
                "0%": { transform: "translate(0px, 0px) scale(1)" },
                "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                "100%": { transform: "translate(0px, 0px) scale(1)" }
              },
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" }
              },
              letterPop: {
                "0%": { opacity: "0", transform: "translateY(25px) scale(0.8)", textShadow: "0 0 0 rgba(0,0,0,0)" },
                "40%": { opacity: "1", textShadow: "0 0 20px rgba(255,255,255,0.7), 0 0 10px currentColor" },
                "100%": { opacity: "1", transform: "translateY(0) scale(1)", textShadow: "inherit" }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0a0a14;
        color: white;
        overflow-x: hidden;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .text-glow {
        text-shadow: 0 0 10px rgba(139, 92, 246, 0.3), 0 0 20px rgba(236, 72, 153, 0.2);
      }
      @keyframes sweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(2deg); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      .animate-sweep {
        animation: sweep 2s ease-in-out infinite;
      }
      /* Hide scrollbar but keep functionality */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>

</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
